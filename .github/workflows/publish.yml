# Publica el paquete en npmjs al empujar un tag vX.Y.Z.
#   npm version patch   # o minor / major (en packages/klin) → crea el commit y el tag
#   git push --follow-tags
# Requiere el secreto NPM_TOKEN (token de npm con permiso de publicación).
# Verifica antes en el workspace (pnpm check). El build corre vía prepublishOnly.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carlos-burelo/klin publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
